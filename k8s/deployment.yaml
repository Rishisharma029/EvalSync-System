apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalsync-gateway-deployment
  namespace: evalsync-prod
  labels:
    app: evalsync-gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: evalsync-gateway
  template:
    metadata:
      labels:
        app: evalsync-gateway
    spec:
      containers:
      - name: gateway
        image: rishisharma029/evalsync-gateway:v4.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: evalsync-secrets
              key: session-secret
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /api/v1/monitoring/prometheus
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/monitoring/prometheus
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: evalsync-gateway-service
  namespace: evalsync-prod
spec:
  type: ClusterIP
  selector:
    app: evalsync-gateway
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evalsync-gateway-hpa
  namespace: evalsync-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evalsync-gateway-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evalsync-ingress
  namespace: evalsync-prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: evalsync.cbse.gov.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: evalsync-gateway-service
            port:
              number: 80
